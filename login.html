<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>লগইন / নিবন্ধন – সুস্থ হবো</title>
<meta name="theme-color" content="#006a4e">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="site-header"></div>
<div class="auth-wrap">
  <div class="auth-brand">
    <img src="logo.svg" alt="সুস্থ হবো">
    <h1>স্বাগতম! সুস্থ হবো পরিবারে যুক্ত হোন</h1>
    <ul>
      <li>🩸 রক্তদাতা হিসেবে মানুষের জীবন বাঁচান</li>
      <li>🆘 জরুরি রক্ত ও চিকিৎসা সহযোগিতার অনুরোধ করুন</li>
      <li>👨‍⚕️ সঠিক ডাক্তার ও হাসপাতাল খুঁজুন</li>
      <li>🤖 এআই গাইডের সহায়তা নিন</li>
    </ul>
  </div>
  <div class="auth-pane">
    <div class="auth-card">
      <div id="loggedIn" style="display:none;text-align:center">
        <div style="font-size:60px">👤</div><h2 id="lname"></h2><p class="small" id="lphone" style="margin-bottom:16px"></p>
        <a href="index.html" class="btn btn-g btn-block" style="margin-bottom:10px">🏠 হোমে যান</a>
        <button class="btn btn-o btn-block" onclick="Auth.out()">🚪 লগআউট</button>
      </div>

      <div id="forms">
        <div class="atabs"><button class="on" data-p="login">লগইন</button><button data-p="signup">নতুন একাউন্ট</button><button data-p="forgot">পাসওয়ার্ড</button></div>
        <div class="msg" id="msg"></div>

        <!-- লগইন -->
        <form class="pane on" id="login">
          <div class="field"><label>মোবাইল নম্বর বা ইমেইল</label><input name="id" placeholder="01XXXXXXXXX" required autocomplete="username"></div>
          <div class="field"><label>পাসওয়ার্ড</label><div class="pw"><input name="pass" type="password" required autocomplete="current-password"><button type="button" class="eye">👁️</button></div></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:16px"><span class="small">🔒 নিরাপদ লগইন</span><button type="button" class="link" data-go="forgot">পাসওয়ার্ড ভুলে গেছেন?</button></div>
          <button class="btn btn-g btn-block">লগইন করুন</button>
          <p class="small" style="text-align:center;margin-top:14px">একাউন্ট নেই? <button type="button" class="link" data-go="signup">নতুন একাউন্ট খুলুন</button></p>
        </form>

        <!-- রেজিস্ট্রেশন -->
        <form class="pane" id="signup">
          <label>আপনি কে?</label>
          <div class="rolep">
            <label><input type="radio" name="role" value="রোগী" checked><i>🙂</i>রোগী</label>
            <label><input type="radio" name="role" value="রক্তদাতা"><i>🩸</i>রক্তদাতা</label>
            <label><input type="radio" name="role" value="ডাক্তার"><i>👨‍⚕️</i>ডাক্তার</label>
            <label><input type="radio" name="role" value="স্বেচ্ছাসেবী"><i>🤝</i>স্বেচ্ছাসেবী</label>
          </div>
          <div class="field"><label>পুরো নাম *</label><input name="name" required></div>
          <div class="row2"><div class="field"><label>মোবাইল *</label><input name="phone" required pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX"></div>
          <div class="field"><label>ইমেইল *</label><input name="email" type="email" required placeholder="পাসওয়ার্ড রিসেটে লাগবে"></div></div>
          <div class="field" id="bgWrap" style="display:none"><label>রক্তের গ্রুপ *</label><select name="blood" id="bgSel"></select></div>
          <div class="row2"><div class="field"><label>বিভাগ</label><select name="division" id="rdv"></select></div><div class="field"><label>জেলা</label><select name="district" id="rdi"></select></div></div>
          <div class="field"><label>উপজেলা</label><select name="upazila" id="rup"></select></div>
          <div class="field"><label>পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)</label><div class="pw"><input name="pass" id="rpass" type="password" required minlength="6" autocomplete="new-password"><button type="button" class="eye">👁️</button></div><div class="meter"><i id="meter"></i></div></div>
          <div class="field"><label>পাসওয়ার্ড আবার দিন *</label><input name="pass2" type="password" required></div>
          <label style="font-weight:400;display:flex;gap:8px;align-items:flex-start;margin-bottom:16px"><input type="checkbox" required style="width:auto;margin-top:5px"> আমি শর্তাবলী মেনে নিচ্ছি। রক্তদাতা হলে জরুরি প্রয়োজনে আমার নম্বর লগইন করা ব্যবহারকারীরা দেখতে পারবেন।</label>
          <button class="btn btn-r btn-block">একাউন্ট খুলুন</button>
        </form>

        <!-- পাসওয়ার্ড রিসেট -->
        <div class="pane" id="forgot">
          <form id="f1">
            <p class="small" style="margin-bottom:12px">রেজিস্ট্রেশনের ইমেইল দিন। আমরা একটি রিসেট কোড পাঠাব।</p>
            <div class="field"><label>ইমেইল</label><input name="email" type="email" required></div>
            <button class="btn btn-g btn-block">কোড পাঠান</button>
          </form>
          <form id="f2" style="display:none">
            <div class="field"><label>ইমেইলে পাঠানো কোড</label><input name="code" required></div>
            <div class="field"><label>নতুন পাসওয়ার্ড</label><input name="pass" type="password" minlength="6" required></div>
            <button class="btn btn-r btn-block">পাসওয়ার্ড বদলান</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="site-footer"></div>
<script src="config.js"></script><script src="data.js"></script><script src="app.js"></script>
<script>
Layout.init('login');
const u = Auth.user();
if(u){ $('#forms').style.display = 'none'; $('#loggedIn').style.display = 'block'; $('#lname').textContent = u.name; $('#lphone').textContent = (u.role || '') + ' • ' + (u.phone || ''); }

const msg = (t, ok) => { const m = $('#msg'); m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; };
const showPane = id => { $$('.atabs button').forEach(b => b.classList.toggle('on', b.dataset.p === id)); $$('.pane').forEach(p => p.classList.toggle('on', p.id === id)); $('#msg').className = 'msg'; };
$$('.atabs button').forEach(b => b.onclick = () => showPane(b.dataset.p));
$$('[data-go]').forEach(b => b.onclick = () => showPane(b.dataset.go));
$$('.eye').forEach(b => b.onclick = () => { const i = b.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; });

Geo.bind($('#rdv'), $('#rdi'), $('#rup'), { d:'বিভাগ বাছুন', s:'জেলা বাছুন', u:'উপজেলা বাছুন' });
$('#bgSel').innerHTML = '<option value="">বাছুন</option>' + BLOOD_GROUPS.map(g => `<option>${g}</option>`).join('');
$$('[name=role]').forEach(r => r.onchange = () => { const d = $('[name=role]:checked').value === 'রক্তদাতা'; $('#bgWrap').style.display = d ? 'block' : 'none'; $('#bgSel').required = d; });
$('#rpass').oninput = e => { const v = e.target.value; let s = 0; if(v.length >= 6) s++; if(v.length >= 9) s++; if(/\d/.test(v) && /[a-zA-Z]/.test(v)) s++; if(/[^a-zA-Z0-9]/.test(v)) s++; const m = $('#meter'); m.style.width = s * 25 + '%'; m.style.background = ['#f42a41','#f59e0b','#84cc16','#006a4e'][Math.max(s - 1, 0)]; };

async function run(btn, fn){ btn.disabled = true; const t = btn.textContent; btn.textContent = '⏳ অপেক্ষা করুন...'; try{ await fn(); } finally { btn.disabled = false; btn.textContent = t; } }
function demo(){ msg('ডেমো মোড: config.js-এ Google Apps Script লিংক (API_URL) বসালে সত্যিকারের লগইন কাজ করবে।', false); }

$('#login').onsubmit = e => { e.preventDefault(); run(e.submitter, async () => {
  const f = Object.fromEntries(new FormData(e.target));
  const r = await api('login', { id:f.id.trim(), pass: await Auth.hash(f.pass) });
  if(r.demo) return demo(); if(!r.ok) return msg(r.msg || 'লগইন ব্যর্থ হয়েছে', false);
  Auth.set(r.user); location.href = 'index.html';
}); };

$('#signup').onsubmit = e => { e.preventDefault(); run(e.submitter, async () => {
  const f = Object.fromEntries(new FormData(e.target));
  if(f.pass !== f.pass2) return msg('দুটি পাসওয়ার্ড মিলছে না', false);
  const { pass, pass2, ...rest } = f;
  const r = await api('register', { ...rest, pass: await Auth.hash(pass) });
  if(r.demo) return demo(); if(!r.ok) return msg(r.msg || 'নিবন্ধন ব্যর্থ হয়েছে', false);
  msg('✅ একাউন্ট তৈরি হয়েছে! এখন লগইন করুন।', true); e.target.reset(); showPane('login'); msg('✅ একাউন্ট তৈরি হয়েছে! এখন লগইন করুন।', true);
}); };

let resetEmail = '';
$('#f1').onsubmit = e => { e.preventDefault(); run(e.submitter, async () => {
  resetEmail = new FormData(e.target).get('email').trim();
  const r = await api('forgot', { email: resetEmail });
  if(r.demo) return demo(); if(!r.ok) return msg(r.msg || 'ইমেইল পাওয়া যায়নি', false);
  msg('✅ কোড পাঠানো হয়েছে, ইমেইল দেখুন।', true); $('#f1').style.display = 'none'; $('#f2').style.display = 'block';
}); };
$('#f2').onsubmit = e => { e.preventDefault(); run(e.submitter, async () => {
  const f = Object.fromEntries(new FormData(e.target));
  const r = await api('reset', { email: resetEmail, code: f.code.trim(), pass: await Auth.hash(f.pass) });
  if(r.demo) return demo(); if(!r.ok) return msg(r.msg || 'কোড ভুল বা মেয়াদ শেষ', false);
  showPane('login'); msg('✅ পাসওয়ার্ড বদলেছে। এখন লগইন করুন।', true);
}); };
</script>
</body></html>
